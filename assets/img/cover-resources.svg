<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F8573"/>
      <stop offset="1" stop-color="#25B891"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F7F0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- back card and main card back to original positions -->
  <g transform="translate(170 190) rotate(-7)">
    <rect width="280" height="190" rx="20" fill="#FFFFFF" fill-opacity="0.18"/>
  </g>
  <g transform="translate(190 210) rotate(4)">
    <rect width="300" height="170" rx="20" fill="url(#card)"/>
    <rect x="24" y="24" width="60" height="10" rx="5" fill="#25B891"/>
    <rect x="24" y="52" width="252" height="9" rx="4.5" fill="#1F8573" opacity="0.4"/>
    <rect x="24" y="72" width="200" height="9" rx="4.5" fill="#1F8573" opacity="0.3"/>
    <rect x="24" y="92" width="240" height="9" rx="4.5" fill="#1F8573" opacity="0.3"/>
    <rect x="24" y="120" width="100" height="22" rx="11" fill="#FFD66F"/>
  </g>
</svg>
