<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2F50"/>
      <stop offset="1" stop-color="#825DD2"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8ECF5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- knowledge graph -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M300 250 L440 170 L600 210"/>
    <path d="M300 250 L440 340 L580 380"/>
    <path d="M440 170 L440 340"/>
    <path d="M600 210 L660 300"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="300" cy="250" r="14"/>
    <circle cx="440" cy="170" r="10"/>
    <circle cx="440" cy="340" r="10"/>
    <circle cx="600" cy="210" r="9"/>
    <circle cx="580" cy="380" r="8"/>
    <circle cx="660" cy="300" r="7"/>
  </g>

  <!-- sticky note back in its original centered position -->
  <g transform="translate(150 180) rotate(-6)">
    <rect width="200" height="180" rx="16" fill="url(#note)"/>
    <rect x="18" y="18" width="70" height="8" rx="4" fill="#825DD2"/>
    <rect x="18" y="44" width="164" height="7" rx="3.5" fill="#1E2F50" opacity="0.35"/>
    <rect x="18" y="62" width="140" height="7" rx="3.5" fill="#1E2F50" opacity="0.25"/>
    <rect x="18" y="80" width="164" height="7" rx="3.5" fill="#1E2F50" opacity="0.25"/>
    <rect x="18" y="104" width="90" height="22" rx="11" fill="#1E2F50" opacity="0.85"/>
  </g>
</svg>
