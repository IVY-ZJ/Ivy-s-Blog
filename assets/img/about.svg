<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E5CE6"/>
      <stop offset="0.5" stop-color="#7D5BF0"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#5AC8FA" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5AC8FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.85" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#FF375F" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF375F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <g filter="url(#soft)">
    <circle cx="360" cy="220" r="320" fill="url(#g1)"/>
    <circle cx="1280" cy="420" r="360" fill="url(#g2)"/>
  </g>
  <g fill="#ffffff" opacity="0.07">
    <circle cx="180" cy="460" r="110"/>
    <circle cx="1380" cy="180" r="140"/>
  </g>
</svg>
