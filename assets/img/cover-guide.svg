<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="ring" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Compass rose ring -->
  <circle cx="400" cy="225" r="150" fill="url(#ring)"/>
  <circle cx="400" cy="225" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="400" cy="225" r="124" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="3 8"/>

  <!-- Cardinal tick marks -->
  <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
    <line x1="400" y1="82" x2="400" y2="98"/>
    <line x1="400" y1="352" x2="400" y2="368"/>
    <line x1="257" y1="225" x2="273" y2="225"/>
    <line x1="527" y1="225" x2="543" y2="225"/>
  </g>

  <!-- Main needle (NE) -->
  <polygon points="400,130 428,225 400,212" fill="#FFFFFF"/>
  <!-- Secondary needle (SW) -->
  <polygon points="400,320 372,225 400,238" fill="#FFFFFF" fill-opacity="0.45"/>

  <!-- Center hub -->
  <circle cx="400" cy="225" r="14" fill="#FF6B6B"/>
  <circle cx="400" cy="225" r="6" fill="#FFFFFF"/>

  <!-- North marker -->
  <g transform="translate(400 66)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#FF6B6B">N</text>
  </g>

  <!-- Bottom title bar -->
  <g transform="translate(400 430)">
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.14"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" letter-spacing="2">GUIDE</text>
  </g>
</svg>